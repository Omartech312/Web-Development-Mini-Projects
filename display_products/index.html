<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Display Using Classes</title>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>

</head>
<body>
    <h1>Displaying products using classes rather than a database</h1>
    
    <h2>Add New product (Admin side):</h2>
    
        <label for="Pname">Product Name:</label>
        <input id="Pname" type="text" placeholder="Milk" required /> <br>

        <label for="Pprice">Product Price:</label>
        <input id="Pprice" type="number" placeholder="20" required /> <br>

        <label for="Pquantity">Product Quantity:</label>
        <input id="Pquantity" type="number" placeholder="12" required /> <br>

        <label for="Punit">Product Unit:</label>
        <input id="Punit" type="text" placeholder="Kg/lbs" required /> <br>

        <label for="Pimage">Provide an image (not required):</label>
        <input id="Pimage" type="file" accept="image/*"> <br>

        <button id="Psubmit">Add Product</button>
    <hr>

    <h2>Display Products (Client Side):</h2>
    <p> <span style="color: red;">X</span> will only be visible for admins to remove elements from the catalog</p>
    <div id="container">
        
    </div>
    
</body>
</html>
